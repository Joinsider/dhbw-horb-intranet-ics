[project]
name = "dhbw-intranet-ics"
version = "0.1.0"
description = "Stellt den Stundenplan aus dem Intranet der DHBW Horb als ICS-Kalender-Abo bereit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "icalendar>=6.0",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhbw_ics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
